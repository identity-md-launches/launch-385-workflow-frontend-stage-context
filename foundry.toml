[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = []
gas_reports = ["LaunchToken", "ReferralList"]

[fuzz]
runs = 256

[invariant]
runs = 32
depth = 48
fail_on_revert = false

[fmt]
line_length = 120
